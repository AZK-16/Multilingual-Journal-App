<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Note — Journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00897B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="icon-btn" id="backBtn" href="./index.html" aria-label="Back to all notes">←</a>
    <div class="save-state" id="saveState" aria-live="polite"></div>
    <div style="flex:1"></div>
    <button class="icon-btn" id="favBtn" type="button" aria-label="Favourite this note" aria-pressed="false">☆</button>
    <button class="icon-btn" id="overflowBtn" type="button" aria-label="Note options">⋮</button>
  </div>

  <input class="editor-title" id="editorTitle" dir="auto" placeholder="Title"
         aria-label="Note title" autocomplete="off">
  <div class="editor-meta" id="editorMeta"></div>

  <div class="editor-body" id="editorBody" contenteditable="true" dir="auto"
       role="textbox" aria-multiline="true" aria-label="Note body"
       data-placeholder="Start writing — in any language, or a few at once…"></div>
</div>

<script type="module" src="./js/editor-page.js"></script>
<script src="./js/register-sw.js"></script>
</body>
</html>
