<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Folder — Journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00897B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="icon-btn" href="./folders.html" aria-label="Back to folders">←</a>
    <h1 id="folderName" dir="auto">Folder</h1>
    <button class="icon-btn" id="overflowBtn" type="button" aria-label="Folder options">⋮</button>
  </div>

  <div class="search-bar">
    <span aria-hidden="true">🔍</span>
    <input id="searchInput" type="search" inputmode="search" dir="auto"
           placeholder="Search this folder" aria-label="Search this folder" autocomplete="off">
    <button class="search-clear hidden" id="searchClear" type="button" aria-label="Clear search">✕</button>
  </div>

  <div class="sort-row">
    <span class="result-count" id="resultCount"></span>
    <button class="sort-pill" id="sortBtn" type="button">Newest first ↓</button>
  </div>

  <div class="note-grid" id="noteGrid"></div>

  <button class="fab" id="newNoteBtn" type="button" aria-label="New note in this folder">+</button>
</div>

<script type="module" src="./js/folder-page.js"></script>
<script src="./js/register-sw.js"></script>
</body>
</html>
